name: Daily YC Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC every day
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: YC_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r YC_scraper/requirements.txt

      - name: Write auth files
        working-directory: YC_scraper
        env:
          COOKIES_B64: ${{ secrets.COOKIES_B64 }}
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
        run: |
          echo "$COOKIES_B64" | base64 -d > cookies.json
          echo "$ALGOLIA_KEY" > algolia_key.txt

      - name: Run scraper
        working-directory: YC_scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
