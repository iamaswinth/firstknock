[project]
name = "firstknock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # LLM clients
    "anthropic>=0.34.0",
    "openai>=1.30.0",

    # LangGraph / LangSmith (inference engine + tracing)
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",

    # PDF / DOCX / OCR parsing
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",

    # Text processing
    "rapidfuzz>=3.6.0",
    "dateparser>=1.2.0",
    "langdetect>=1.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.0",

    # Graph database (Memgraph speaks Bolt — same driver as Neo4j)
    "neo4j>=5.18.0",

    # Task queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",

    # External APIs + scraping
    "httpx>=0.27.0",
    "playwright>=1.42.0",

    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.9",

    # Auth — Clerk JWT verification (RS256 via JWKS)
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firstknock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
