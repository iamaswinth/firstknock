<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FirstKnock · Dashboard Wireframes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Architects+Daughter&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="wireframe-kit.jsx"></script>
  <script type="text/babel" src="direction-a.jsx"></script>
  <script type="text/babel" src="direction-b.jsx"></script>
  <script type="text/babel" src="direction-c.jsx"></script>

  <script type="text/babel">
    // Standard artboard size for desktop screens
    const W = 1280, H = 820;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="intro"
            title="FirstKnock — Dashboard wireframes"
            subtitle="3 directions × 4 screens · candidate self-view · drop a PDF, get a skill graph"
          >
            <DCArtboard id="legend" label="System legend" width={520} height={H}>
              <div style={{ padding: 28, fontFamily: 'Inter, system-ui, sans-serif', color: '#1a1a1a', height: '100%', display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 1.6, color: '#7a7a7a', textTransform: 'uppercase' }}>How to read these</div>
                <div style={{ fontSize: 13, lineHeight: 1.55, color: '#3a3a3a' }}>
                  Clean greyscale boxes — strokes carry hierarchy, fills mark zones, dashed lines mean
                  &ldquo;not finalized&rdquo; or &ldquo;inferred&rdquo;. Each row below is one design direction;
                  read it left → right as a user would walk through the product.
                </div>

                <div style={{ height: 1, background: '#1a1a1a' }} />

                <div style={{ display: 'grid', gridTemplateColumns: '90px 1fr', rowGap: 12, columnGap: 14, alignItems: 'center', fontSize: 11.5 }}>
                  <div style={{ width: 60, height: 18, border: '1.2px solid #1a1a1a', borderRadius: 100, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontFamily: 'JetBrains Mono', color: '#1a1a1a' }}>chip</div>
                  <div style={{ color: '#3a3a3a' }}>solid · a real entity from the API (skill, company)</div>

                  <div style={{ width: 60, height: 18, border: '1.2px dashed #1a1a1a', borderRadius: 100, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontFamily: 'JetBrains Mono', color: '#1a1a1a' }}>chip</div>
                  <div style={{ color: '#3a3a3a' }}>dashed · inferred / not yet confirmed</div>

                  <div style={{ width: 60, height: 18, border: '1.2px solid #1a1a1a', borderRadius: 100, background: '#1a1a1a' }} />
                  <div style={{ color: '#3a3a3a' }}>filled · current selection / active state</div>

                  <div style={{ width: 60, height: 30, background: 'repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,0.06) 6px 7px)', border: '1px dashed #1a1a1a' }} />
                  <div style={{ color: '#3a3a3a' }}>striped slot · live data / image / async tile</div>

                  <div style={{ width: 60, height: 30, background: '#fff', border: '1.2px solid #1a1a1a' }} />
                  <div style={{ color: '#3a3a3a' }}>solid card · primary surface</div>

                  <div style={{ fontFamily: '"Architects Daughter", cursive', fontSize: 14, color: '#1a1a1a', textAlign: 'center' }}>note</div>
                  <div style={{ color: '#3a3a3a' }}>handwritten · design rationale / behaviour note</div>
                </div>

                <div style={{ height: 1, background: '#dedcd8' }} />

                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 1.4, color: '#7a7a7a', textTransform: 'uppercase' }}>Mapped to your API</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 11, color: '#3a3a3a' }}>
                  {[
                    ['POST /ingest',          'upload → resume_id + user_id'],
                    ['GET /resume/{rid}',     'poll status, full extracted JSON'],
                    ['GET /profile/{uid}',    'merged identity + scorecard'],
                    ['GET /skills/{uid}',     'explicit + inferred + reasons'],
                    ['GET /graph/{uid}',      'nodes + edges + communities'],
                    ['GET /analytics/{uid}',  'timeline · bridges · inferred'],
                  ].map(([p, w]) => (
                    <div key={p} style={{ display: 'flex', gap: 10 }}>
                      <div style={{ width: 170, fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: '#1a1a1a' }}>{p}</div>
                      <div style={{ flex: 1, color: '#3a3a3a' }}>{w}</div>
                    </div>
                  ))}
                </div>

                <div style={{ flex: 1 }} />
                <div style={{ fontFamily: '"Architects Daughter", cursive', fontSize: 14, color: '#3a3a3a', lineHeight: 1.4 }}>
                  Click any artboard&rsquo;s ⤢ to focus it fullscreen. Drag the grip to reorder.
                  Use ← → ↑ ↓ in focus mode to walk through screens and directions.
                </div>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="dirA"
            title="A — Bento dashboard"
            subtitle="Single scroll · graph is the biggest tile · everything else as modular cards around it"
          >
            <DCArtboard id="a1" label="1 · Upload" width={W} height={H}><A_Upload /></DCArtboard>
            <DCArtboard id="a2" label="2 · Processing" width={W} height={H}><A_Processing /></DCArtboard>
            <DCArtboard id="a3" label="3 · Dashboard" width={W} height={H}><A_Dashboard /></DCArtboard>
            <DCArtboard id="a4" label="4 · Graph focus" width={W} height={H}><A_GraphFocus /></DCArtboard>
          </DCSection>

          <DCSection
            id="dirB"
            title="B — Graph as canvas"
            subtitle="Force graph full-bleed · everything else floats as draggable glass panels overlaid on it"
          >
            <DCArtboard id="b1" label="1 · Upload" width={W} height={H}><B_Upload /></DCArtboard>
            <DCArtboard id="b2" label="2 · Processing" width={W} height={H}><B_Processing /></DCArtboard>
            <DCArtboard id="b3" label="3 · Dashboard" width={W} height={H}><B_Dashboard /></DCArtboard>
            <DCArtboard id="b4" label="4 · Node selected" width={W} height={H}><B_NodeFocus /></DCArtboard>
          </DCSection>

          <DCSection
            id="dirC"
            title="C — Sidebar + focused panes"
            subtitle="Left rail · one section visible at a time · structured, report-like, fast keyboard nav"
          >
            <DCArtboard id="c1" label="1 · Upload" width={W} height={H}><C_Upload /></DCArtboard>
            <DCArtboard id="c2" label="2 · Processing" width={W} height={H}><C_Processing /></DCArtboard>
            <DCArtboard id="c3" label="3 · Overview" width={W} height={H}><C_Overview /></DCArtboard>
            <DCArtboard id="c4" label="4 · Graph pane" width={W} height={H}><C_GraphPane /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
